[package]
name = "naeasy"
version = "0.1.0"
description = "Minimal menu-bar navigator for your local Git projects"
authors = ["Vahagn"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "naeasy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
